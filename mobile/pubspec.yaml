name: stok_takip
description: Barkodlu depo ve stok uygulaması (Flutter istemcisi).
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cross_file: ^0.3.4
  http: ^1.2.2
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Uygulama ikonu: flutter pub get && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  android: false
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
